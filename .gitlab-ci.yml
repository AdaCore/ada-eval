variables:
  UV_PYTHON_DOWNLOADS: never

stages:
  - validate-datasets
  - lint
  - test


.script-snippets:
  # Install the tools needed to run evaluations
  install-eval-tools:
    - anod init wave /it/wave
    - eval "$(cd "/it/wave"; anod install gnatformat; anod printenv gnatformat)"
    - |
      for tool in gnat:16.1.0 gprbuild:26.0.0 gnatprove:16.1.0; do
        name="${tool%%:*}"
        version="x86_64-linux-${tool#*:}"
        download_generic_package eng/ai/ada-eval "/it/$name.tar.gz" "$version"
        tar -xzf "/it/$name.tar.gz" -C /it/
        export PATH="/it/$name-$version-1/bin:$PATH"
      done
    # Record the active toolchain in the job log.
    - gnat --version | sed -n 1p
    - gnatprove --version | sed -n 1p
    - gprbuild --version | sed -n 1p
    - gnatformat --version


.default:
  services:
    - image:pe-base-24
  before_script:
    - rm .python-version  # Use whatever is available in the image
    - pip install uv
    - export UV_DEFAULT_INDEX="$PIP_INDEX_URL"
    - export UV_INDEX="$PROJECT_PIP_INDEX_URL"
    - uv sync
    - git config --global user.email "ci@adacore.com"
    - git config --global user.name "CI"

check-datasets:
  extends: .default
  stage: validate-datasets
  needs: []
  services:
    - image:pe-base-24
    - cpu:16
  script:
    - !reference [.script-snippets, install-eval-tools]
    - uv run ada-eval check-datasets --jobs 8

.lint:
  extends: .default
  stage: lint
  needs: []
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff:
  extends: .lint
  script:
    - uv run ruff check --output-format=gitlab > code-quality-report.json

mypy:
  extends: .lint
  script:
    - uv run mypy --no-error-summary > mypy-out.txt || FAILED=true
    - uv run mypy-gitlab-code-quality < mypy-out.txt > code-quality-report.json
    - if [ ! -z ${FAILED+x} ]; then echo "mypy was unhappy 😞" && exit 1; fi

.pytest:
  extends: .default
  stage: test
  needs: []
  script:
    - !reference [.script-snippets, install-eval-tools]
    - uv run pytest --junitxml=report.xml --cov-report xml:coverage.xml -m '' -n 1
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/

pytest-3.12:
  extends: .pytest
  services:
    - image:pe-base-24-py312

pytest-3.14:
  extends: .pytest
  services:
    - image:pe-base-24-py314

include:
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: lint
# Other jobs lack explicit rules. Use $CI_COMMIT_BRANCH, which is the 
# default pipeline trigger, so all jobs show up in the MR.
export_control_checks:
  rules:
    - if: $CI_COMMIT_BRANCH
